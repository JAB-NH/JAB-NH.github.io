    <script>

        let currentIndex = images.indexOf("assets/img/HaddadFamily/Haddad%20Family%20Group%20Photo.JPG");
        if (currentIndex === -1) currentIndex = 0;

        function updateCarousel() {
            document.getElementById('carouselMainImage').src = images[currentIndex];
            document.querySelectorAll('#thumbnailStrip img').forEach((img, idx) => {
                if (idx === currentIndex) {
                    img.classList.add('thumb-active');
                    img.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    img.classList.remove('thumb-active');
                }
            });
        }

        function setImage(index, element) {
            currentIndex = index;
            updateCarousel();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateCarousel();
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            updateCarousel();
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            updateCarousel();
        });
    </script>
